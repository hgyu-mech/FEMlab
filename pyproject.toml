[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femlab-research"
version = "0.1.0.dev0"
description = "Verification-first foundations for ML-assisted computational mechanics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
ml = ["torch>=2.2"]

[project.scripts]
femlab-benchmark = "femlab.benchmarks:main"

[tool.setuptools.packages.find]
include = ["femlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
